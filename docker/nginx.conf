server {
    listen 80;
    listen 8000;
    server_name _;
    root /var/www/public;

    index index.php index.html;
    charset utf-8;

    # Logging langsung ke Docker stdout & stderr agar terlihat di log Dokploy
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 100M;

    # Gzip Compression untuk performa & Pagespeed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets handling — fall through ke PHP jika file tidak ditemukan
    # (penting untuk Livewire dynamic asset route: /livewire/livewire.min.js)
    # Khusus livewire assets, jangan cache jika 404 dan pastikan try_files bekerja
    location /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite assets are content-hashed, so they can be cached for a year.
    location ^~ /build/assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Optimized images use source-versioned URLs and can be cached immutably.
    location ^~ /storage/optimized/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Responsive images include a source-content fingerprint in their filename.
    location ^~ /images/optimized/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|avif|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel route routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Security Headers (termasuk HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://www.google.com; object-src 'none';" always;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_hide_header X-Powered-By;
    }

    # Block sensitive Laravel directories from public access
    location ~* ^/(storage/logs|storage/framework|bootstrap/cache) {
        deny all;
        return 403;
    }

    # Block sensitive config & lock files
    location ~* \.(log|env|lock|yaml|yml|toml|ini|bak|swp|sql|sh)$ {
        deny all;
        return 403;
    }

    # Block source map files in production
    location ~* \.map$ {
        deny all;
        return 403;
    }

    # Never expose environment files, even if one is accidentally copied into public/.
    location ~* (^|/)\.env(?:\.[^/]*)?$ {
        return 404;
    }

    # Block dot-files & dot-directories (except .well-known)
    location ~ /\.(?!well-known).* {
        return 404;
    }
}
